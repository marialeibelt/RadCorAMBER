# ============================================================
# TGEANT/AMBER analysis — NLO CU, stage 1 (first 7,000,000 events)
# ============================================================

# Change to .../NLO_CU_08_11_xi1_stage2 for the second stage.
inputdir="/nfs/momos/user/mleibelt/TGEANT_runs/output/NLO_CU_08_11_xi1_batch_7000_rest"
file_glob="*.tgeant.gz"

# Prevent accidental analysis of a partly completed TGEANT campaign.
# Verify separately with qstat that no TGEANT jobs are still running. 1470
expected_files=7170
expected_events=7170000

# Permanent merged ROOT output — TH1 histograms and TGEANTTruth event TTree.
# TGEANTTruth records primary particle information only, NOT detector hits.
# It is NOT a lossless replacement for .tgeant.gz. Keep originals until
# CORAL/PHAST has finished and relevant data are archived and verified.
# histogramfile="/nfs/freenas/tuph/e18/project/prm/mleibelt/AMBER_Repo/AMBER_RadCor/histograms/NLO_CU_08_11_xi1_stage1_TGEANT_truth.root"
histogramfile="/nfs/momos/user/mleibelt/AMBER_Results/histograms/NLO_CU_08_11_xi1_batch_7000_rest_TGEANT_truth.root"
# Individual publication-style plots and plot/inventory log.
figurebase="/nfs/momos/user/mleibelt/AMBER_Results/Figures/"
figurefoldername="NLO_CU_08_11_xi1_batch_7000_rest_truth"

# Chunk-by-chunk processing: avoids thousands of temporary files and a huge
# single hadd command. Chunks are retained so interrupted jobs can resume.
chunk_size=50
cache_dir="${histogramfile%.root}_analysis_chunks"
resume=1

# Save one separate PNG per ROOT TH1/TH2 object, in the McMule figure style.
make_styled_plots=1

# Optional: also run the existing ROOT plotting macro (source not yet supplied).
make_legacy_plots=0

# Do not delete or modify .tgeant.gz inputs in this analysis script.

# IMPORTANT: stage2 needs its own inputdir, expected_files, histogramfile,
# figurefoldername, and cache_dir. Do not reuse this stage1 archive path.
