# ============================================================
# Split all NLO-CU ROOT files (10 independent McMule runs)
# ============================================================

codefolder="/nfs/freenas/tuph/e18/project/prm/mleibelt/AMBER_Repo/AMBER_RadCor/Code"

# Number of entries per output ROOT file (for TGEANT)
batchsize=1000

# Parent folder with part_1, part_2, ... part_10
runfolder="/nfs/momos/user/mleibelt/evtgen_08_11/evtgen_nlo_CU_NthenCU_10x5000_seed10000"

# Part and seed numbers corresponding to the event-generation jobs
nparts=10
first_seed=10000

# The ROOT file in part_i/out/ is:
#   08_11_evtgen_xi1_NLO_CU_part_i_seed<first_seed+i-1>.root
root_prefix="08_11_evtgen_xi1_NLO_CU"

# Final destination: all split files live in a SINGLE flat folder.
# Generated filenames are prefixed with part_i_ to prevent collisions.
outputfolder="$runfolder/NLO_batches_1K"
