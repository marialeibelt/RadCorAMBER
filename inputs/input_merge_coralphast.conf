INPUT_PATTERN="PHAST.*_run000.root"
EXPECTED_FILES=7170
TREE_NAME="UserEvent300/PRM"

# Original TGEANT names are checked against every PHAST filename.
TGEANT_DIR="/nfs/momos/user/mleibelt/TGEANT_runs/output/NLO_CU_08_11_xi1_batch_7000_rest"
