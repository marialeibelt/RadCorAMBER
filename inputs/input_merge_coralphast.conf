ROOT_SETUP="/cvmfs/sft.cern.ch/lcg/views/LCG_104a/x86_64-el9-gcc12-opt/setup.sh"
CORALPHAST_RUNS="/nfs/momos/user/mleibelt/CORAL_PHAST_runs"

# Exactly the full-production directory; pilot runs are excluded.
