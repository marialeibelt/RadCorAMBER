# ============================================================
# CORAL -> standalone PHAST UserEvent300 - production input
# ============================================================
# Edit this file before each new submission, then run:
#   ./submit_coral_phast.sh

# ------------------------------------------------------------
# INPUT TGEANT FILES
# ------------------------------------------------------------

INPUTDIR="/nfs/momos/user/mleibelt/TGEANT_runs/output/NLO_CU_08_11_xi1_batch_7000_rest"
FILE_GLOB="*.tgeant.gz"
OUTPUTNAME="NLO_CU_08_11_xi1_batch_7000_rest"

# ------------------------------------------------------------
# OUTPUT
# ------------------------------------------------------------

CORALPHAST_RUNS="/nfs/momos/user/mleibelt/CORAL_PHAST_runs"

# CORAL monitoring / reproducibility output
OUTPUTDIR="${CORALPHAST_RUNS}/output/coral/${OUTPUTNAME}"
MDSTDIR="${OUTPUTDIR}/mdst"          # only kept if requested or needed after a failure
HISTDIR="${OUTPUTDIR}/hists"
OPTDIR="${OUTPUTDIR}/opts"

# Final compact standalone-PHAST analysis ROOT files
FINALDIR="${CORALPHAST_RUNS}/output/final/${OUTPUTNAME}"

LOGDIR="${CORALPHAST_RUNS}/log/${OUTPUTNAME}"

# ------------------------------------------------------------
# SOFTWARE / ENVIRONMENT
# ------------------------------------------------------------

REPOROOT="/nfs/freenas/tuph/e18/project/prm/mleibelt/AMBER_Repo"
CORALDIR="${REPOROOT}/coral"
PHASTDIR="${REPOROOT}/phast"
TGEANTDIR="${REPOROOT}/TGEANT"

# Tested CORAL reconstruction executable (PHAST embedded in CORAL event loop)
PHASTCORAL_EXE="${PHASTDIR}/coral/coral.exe"

# Standalone PHAST executable + our analysis routine
PHAST_EXE="${PHASTDIR}/phast"
PHAST_USER=300

LCG_VIEW="/cvmfs/sft.cern.ch/lcg/views/LCG_104a/x86_64-el9-gcc12-opt/setup.sh"
TGEANT_SETUP="${TGEANTDIR}/build/thisgeant.sh"
COMPASS_FILES="/cvmfs/compass-condb.cern.ch/detector"

# ------------------------------------------------------------
# TESTED PRM OPTIONS / GEOMETRY
# ------------------------------------------------------------

PRM_PRODUCTION_DIR="${PHASTDIR}/coral/PRM_production"
CORALOPTORIGINAL="${PRM_PRODUCTION_DIR}/PRM_MC.opt"
TRAFDICOPT="${PRM_PRODUCTION_DIR}/trafdic.mc.PRM.p2022.opt"
DETECTORSDAT="${PRM_PRODUCTION_DIR}/detectors.PRM001.dat"
DETECTORSROOT="${PRM_PRODUCTION_DIR}/detectors.PRM001.root"

# ------------------------------------------------------------
# STORAGE POLICY
# ------------------------------------------------------------

# 0 = successful mDSTs are deleted after standalone PHAST succeeds.
# Pilot uses 1: keep them until PHAST output content is verified.
# 1 = successful mDSTs are also kept permanently in MDSTDIR.
KEEP_MDST=0

# If CORAL succeeds but standalone PHAST fails:
# 1 = preserve the newly generated mDST in MDSTDIR for debugging/retry.
# 0 = let the scratch copy disappear with the failed job.
SAVE_MDST_ON_PHAST_FAILURE=1

# ------------------------------------------------------------
# SUBMISSION SAFETY
# ------------------------------------------------------------

# When MAX_FILES=0, require exactly this number of TGEANT inputs.
EXPECTED_FILES=7170

# 1 = print the selection and do not submit; 0 = submit.
DRY_RUN=0

# ------------------------------------------------------------
# CLUSTER SETTINGS
# ------------------------------------------------------------

# 0 = submit all matching input files. Set e.g. 5 for a small pilot submission.
# Start with 5 files (pilot), then use 0 for the full 7,000-file stage.
MAX_FILES=0

MAX_JOBS=700
QUEUE="short"
SGE_QUEUE="short_epyc"
MEMORY="2G"
